<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iscariot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="space">

        <!-- LEFT CARD -->
        <section class="card profile-card">
            <p class="tiny">iscariot</p>

            <h1>ISCARIOT</h1>

            <div class="profile">
                <div class="pfp"></div>

                <div>
                    <h2>@iscariot</h2>
                    <p>music analysis & journalism</p>
                    <p class="muted">finding meaning where there probably isn't any.</p>
                </div>
            </div>
        </section>


        <!-- CENTER CARD -->
        <section class="card center-card">

            <p class="tiny">featured</p>

            <div class="album-art"></div>

            <h3>Census Designated</h3>
            <p class="muted">Jane Remover</p>

            <div class="progress">
                <div class="progress-fill"></div>
            </div>

            <div class="controls">
                <button>◀</button>
                <button class="play">▶</button>
                <button>▶</button>
            </div>

        </section>


        <!-- RIGHT CARD -->
        <section class="card links-card">

            <p class="tiny">links</p>

            <div class="links">
                <a href="#">youtube</a>
                <a href="#">articles</a>
                <a href="#">instagram</a>
                <a href="#">contact</a>
                <a href="#">about</a>
                <a href="#">archive</a>
            </div>

        </section>

    </main>


    <!-- BOTTOM NAV -->

    <nav>
        <button>⌂</button>
        <button>♫</button>
        <button>↗</button>
    </nav>


    <script src="script.js"></script>

</body>
</html>
