<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iscariot</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>
    
<div class="dust"></div>
    
    <main class="space">


        <!-- =========================
             LEFT — PROFILE
        ========================== -->

        <section class="card profile-card">

            <p class="tiny">iscariot</p>

            <h1>ISCARIOT</h1>

            <div class="profile">

            <img class="pfp" src="assets/pfp.png" alt="Iscariot profile picture">
                
                <div>
                    <h2>@iscariot</h2>

                    <p>
                        music analysis & journalism
                    </p>

                    <p class="muted">
                        music, but overthought.
                    </p>
                </div>

            </div>

        </section>



        <!-- =========================
             CENTER — MUSIC PLAYER
        ========================== -->

        <section class="card center-card">

            <p class="player-label">music</p>


            <!-- COVER -->

            <div class="album-cover">

                <img
                    src="assets/cover.jpg"
                    alt="Album cover"
                >

            </div>


            <!-- SONG -->

<div class="song-info">

    <h2 id="song-title">Songs about leaving</h2>

    <p id="song-artist">Jane Remover</p>

</div>


            <!-- PROGRESS -->

            <div class="song-progress">

                <div class="song-progress-fill"></div>

                <div class="song-progress-knob"></div>

            </div>


<div class="timestamps">

    <span id="current-time">0:00</span>

    <span id="duration">2:32</span>

</div>


            <!-- PLAYBACK -->

        <div class="main-controls">
            <button>◀</button>
            <button class="pause" id="play-button">▶</button>
            <button>▷</button>
        </div>

            <!-- EXTRA CONTROLS -->

            <div class="secondary-controls">

                <button>⤨</button>

                <button>↻</button>

            </div>


            <!-- VOLUME -->

            <div class="volume">

                <span>−</span>

                <div class="volume-track">

                    <div class="volume-fill"></div>

                    <div class="volume-knob"></div>

                </div>

                <span>+</span>

            </div>

<audio
    id="audio-player"
    src="assets/music/songs-about-leaving.mp3"
></audio>
        </section>



        <!-- =========================
             RIGHT — LINKS
        ========================== -->

        <section class="card links-card">

            <p class="tiny">links</p>

            <div class="links">

                <a href="https://www.youtube.com/@IscariotReal">youtube</a>

                <a href="articles.html">articles</a>

                <a href="https://www.instagram.com/iscariotreal/">instagram</a>

                <a href="contact.html">contact</a>

                <a href="about.html">about</a>

                <a href="archive.html">archive</a>

            </div>

        </section>


    </main>



    <!-- =========================
         BOTTOM NAV
    ========================== -->

    <nav>

        <button>⌂</button>

        <button>♫</button>

        <button>↗</button>

    </nav>


    <script src="script.js"></script>
    
<script>
    const audioPlayer = document.getElementById("audio-player");
    const playButton = document.getElementById("play-button");

    playButton.addEventListener("click", function () {
        if (audioPlayer.paused) {
            audioPlayer.play();
        } else {
            audioPlayer.pause();
        }
    });
</script>

</body>

</html>
