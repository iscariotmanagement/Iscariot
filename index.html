<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iscariot</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>
    
<div class="dust"></div>
    
    <main class="space">


        <!-- =========================
             LEFT — PROFILE
        ========================== -->

        <section class="card profile-card">

            <p class="tiny">iscariot</p>

            <h1>ISCARIOT</h1>

            <div class="profile">

                <div class="pfp"></div>

                <div>
                    <h2>@iscariot</h2>

                    <p>
                        music analysis & journalism
                    </p>

                    <p class="muted">
                        music, but overthought.
                    </p>
                </div>

            </div>

        </section>



        <!-- =========================
             CENTER — MUSIC PLAYER
        ========================== -->

        <section class="card center-card">

            <p class="player-label">music</p>


            <!-- COVER -->

            <div class="album-cover">

                <img
                    src="assets/cover.jpg"
                    alt="Album cover"
                >

            </div>


            <!-- SONG -->

            <div class="song-info">

                <h2>Song Title</h2>

                <p>Artist</p>

            </div>


            <!-- PROGRESS -->

            <div class="song-progress">

                <div class="song-progress-fill"></div>

                <div class="song-progress-knob"></div>

            </div>


            <div class="timestamps">

                <span>0:23</span>

                <span>3:22</span>

            </div>


            <!-- PLAYBACK -->

            <div class="main-controls">

                <button>Ⅰ◀</button>

                <button class="pause">Ⅱ</button>

                <button>▶Ⅰ</button>

            </div>


            <!-- EXTRA CONTROLS -->

            <div class="secondary-controls">

                <button>⤨</button>

                <button>↻</button>

            </div>


            <!-- VOLUME -->

            <div class="volume">

                <span>−</span>

                <div class="volume-track">

                    <div class="volume-fill"></div>

                    <div class="volume-knob"></div>

                </div>

                <span>+</span>

            </div>

        </section>



        <!-- =========================
             RIGHT — LINKS
        ========================== -->

        <section class="card links-card">

            <p class="tiny">links</p>

            <div class="links">

                <a href="#">youtube</a>

                <a href="#">articles</a>

                <a href="#">instagram</a>

                <a href="#">contact</a>

                <a href="#">about</a>

                <a href="#">archive</a>

            </div>

        </section>


    </main>



    <!-- =========================
         BOTTOM NAV
    ========================== -->

    <nav>

        <button>⌂</button>

        <button>♫</button>

        <button>↗</button>

    </nav>


    <script src="script.js"></script>

</body>

</html>
