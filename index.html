<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iscariot</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="space">

        <!-- LEFT CARD -->
        <section class="card profile-card">
<section class="card center-card">

    <p class="player-label">music</p>

    <div class="album-cover">
        <img src="assets/cover.jpg" alt="Album cover">
    </div>

    <div class="song-info">
        <h2>Song Title</h2>
        <p>Artist</p>
    </div>

    <div class="song-progress">
        <div class="song-progress-fill"></div>
        <div class="song-progress-knob"></div>
    </div>

    <div class="timestamps">
        <span>0:23</span>
        <span>3:22</span>
    </div>

    <div class="main-controls">
        <button>Ⅰ◀</button>
        <button class="pause">Ⅱ</button>
        <button>▶Ⅰ</button>
    </div>

    <div class="secondary-controls">
        <button>⤨</button>
        <button>↻</button>
    </div>

    <div class="volume">
        <span>−</span>

        <div class="volume-track">
            <div class="volume-fill"></div>
            <div class="volume-knob"></div>
        </div>

        <span>+</span>
    </div>

</section>

        <!-- RIGHT CARD -->
        <section class="card links-card">

            <p class="tiny">links</p>

            <div class="links">
                <a href="#">youtube</a>
                <a href="#">articles</a>
                <a href="#">instagram</a>
                <a href="#">contact</a>
                <a href="#">about</a>
                <a href="#">archive</a>
            </div>

        </section>

    </main>


    <!-- BOTTOM NAV -->

    <nav>
        <button>⌂</button>
        <button>♫</button>
        <button>↗</button>
    </nav>


    <script src="script.js"></script>

</body>
</html>
