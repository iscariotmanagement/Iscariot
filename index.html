<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iscariot</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>
    
<div class="dust"></div>
    
    <main class="space">


        <!-- =========================
             LEFT — PROFILE
        ========================== -->

        <section class="card profile-card">

            <p class="tiny">iscariot</p>

            <h1>ISCARIOT</h1>

            <div class="profile">

            <img class="pfp" src="assets/pfp.png" alt="Iscariot profile picture">
                
                <div>
                    <h2>@iscariot</h2>

                    <p>
                        music analysis & journalism
                    </p>

                    <p class="muted">
                        music, but overthought.
                    </p>
                </div>

            </div>

        </section>



        <!-- =========================
             CENTER — MUSIC PLAYER
        ========================== -->

        <section class="card center-card">

            <p class="player-label">music</p>


            <!-- COVER -->

            <div class="album-cover">

<img
    src="assets/covers/Songs about leaving cover.png"
    alt="Songs about leaving cover"
>

            </div>


            <!-- SONG -->

<div class="song-info">

    <h2 id="song-title">Songs about leaving</h2>

    <p id="song-artist">Jane Remover</p>

</div>


            <!-- PROGRESS -->

            <div class="song-progress">

                <div class="song-progress-fill"></div>

                <div class="song-progress-knob"></div>

            </div>


<div class="timestamps">

    <span id="current-time">0:00</span>

    <span id="duration">2:32</span>

</div>


            <!-- PLAYBACK -->

        <div class="main-controls">
            <button>◀</button>
            <button class="pause" id="play-button">▶</button>
            <button>▷</button>
        </div>

            <!-- EXTRA CONTROLS -->

            <div class="secondary-controls">

                <button>⤨</button>

                <button>↻</button>

            </div>


            <!-- VOLUME -->

            <div class="volume">

                <span>−</span>

                <div class="volume-track">

                    <div class="volume-fill"></div>

                    <div class="volume-knob"></div>

                </div>

                <span>+</span>

            </div>

<audio
    id="audio-player"
    src="assets/music/songs-about-leaving.mp3"
></audio>
        </section>



        <!-- =========================
             RIGHT — LINKS
        ========================== -->

        <section class="card links-card">

            <p class="tiny">links</p>

            <div class="links">

                <a href="https://www.youtube.com/@IscariotReal">youtube</a>

                <a href="articles.html">articles</a>

                <a href="https://www.instagram.com/iscariotreal/">instagram</a>

                <a href="contact.html">contact</a>

                <a href="about.html">about</a>

                <a href="archive.html">archive</a>

            </div>

        </section>


    </main>



    <!-- =========================
         BOTTOM NAV
    ========================== -->

<nav>
    <button id="profile-nav">⌂</button>
    <button id="music-nav">♫</button>
    <button id="links-nav">↗</button>
</nav>


    <script src="script.js"></script>
    
<script>
    const audioPlayer = document.getElementById("audio-player");
    const playButton = document.getElementById("play-button");

    const currentTimeDisplay = document.getElementById("current-time");
    const durationDisplay = document.getElementById("duration");

    const progressBar = document.querySelector(".song-progress");
    const progressFill = document.querySelector(".song-progress-fill");
    const progressKnob = document.querySelector(".song-progress-knob");
    const volumeTrack = document.querySelector(".volume-track");
    const volumeFill = document.querySelector(".volume-fill");
    const volumeKnob = document.querySelector(".volume-knob");

    /* PLAY / PAUSE */

    playButton.addEventListener("click", function () {
        if (audioPlayer.paused) {
            audioPlayer.play();
        } else {
            audioPlayer.pause();
        }
    });


    /* FORMAT SECONDS AS 0:00 */

    function formatTime(seconds) {
        if (!Number.isFinite(seconds)) {
            return "0:00";
        }

        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60)
            .toString()
            .padStart(2, "0");

        return `${minutes}:${remainingSeconds}`;
    }


    /* GET REAL SONG LENGTH */

    audioPlayer.addEventListener("loadedmetadata", function () {
        durationDisplay.textContent = formatTime(audioPlayer.duration);
    });


    /* UPDATE TIME + PROGRESS BAR */

    audioPlayer.addEventListener("timeupdate", function () {

        currentTimeDisplay.textContent =
            formatTime(audioPlayer.currentTime);

        if (!audioPlayer.duration) {
            return;
        }

        const progress =
            (audioPlayer.currentTime / audioPlayer.duration) * 100;

        progressFill.style.width = progress + "%";
        progressKnob.style.left = progress + "%";
    });


    /* CLICK PROGRESS BAR TO SKIP */

    progressBar.addEventListener("click", function (event) {

        if (!audioPlayer.duration) {
            return;
        }

        const bar = progressBar.getBoundingClientRect();

        const clickPosition =
            (event.clientX - bar.left) / bar.width;

        audioPlayer.currentTime =
            clickPosition * audioPlayer.duration;
    });
    /* VOLUME */

audioPlayer.volume = 0.5;

function updateVolume() {
    const volumePercent = audioPlayer.volume * 100;

    volumeFill.style.width = volumePercent + "%";
    volumeKnob.style.left = volumePercent + "%";
}

updateVolume();


volumeTrack.addEventListener("click", function (event) {

    const bar = volumeTrack.getBoundingClientRect();

    let volume =
        (event.clientX - bar.left) / bar.width;

    volume = Math.max(0, Math.min(1, volume));

    audioPlayer.volume = volume;

    updateVolume();
});
    /* PANEL / NAV HOVER */

const profileCard = document.querySelector(".profile-card");
const musicCard = document.querySelector(".center-card");
const linksCard = document.querySelector(".links-card");

const profileNav = document.getElementById("profile-nav");
const musicNav = document.getElementById("music-nav");
const linksNav = document.getElementById("links-nav");


function connectPanel(card, button) {

    card.addEventListener("mouseenter", function () {
        button.classList.add("panel-active");
    });

    card.addEventListener("mouseleave", function () {
        button.classList.remove("panel-active");
    });

}


connectPanel(profileCard, profileNav);
connectPanel(musicCard, musicNav);
connectPanel(linksCard, linksNav);
</script>

</body>

</html>
